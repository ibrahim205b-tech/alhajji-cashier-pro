
name: Bootstrap Alhajji Cashier

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        shell: bash
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create \
              --platforms=android \
              --org com.alhajji.cashier \
              --project-name alhajji_cashier_pro \
              .
          else
            echo "Flutter project already exists."
          fi

      - name: Verify Flutter project
        run: |
          flutter --version
          flutter pub get
          flutter analyze

      - name: Save generated source to GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Initialize Alhajji Cashier Pro"
            git push
          else
            echo "No source changes to commit."
          fi

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alhajji-cashier-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
